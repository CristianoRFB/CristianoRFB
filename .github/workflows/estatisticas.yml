name: Atualizar estatísticas do perfil

on:
  schedule:
    - cron: "0 3 * * *"

  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - README.md
      - .github/workflows/estatisticas.yml
      - .github/scripts/**
      - .github/assets/**

concurrency:
  group: atualizar-readme-perfil
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  gerar-estatisticas:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Gerar cartões do GitHub
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        with:
          USERNAME: CristianoRFB
          BRANCH_NAME: main
          UTC_OFFSET: -3
          AUTO_PUSH: false
          THEME: radical
          ANIMATION: load
          DURATION: 3

      - name: Aplicar tema preto e vermelho neon
        shell: bash
        run: |
          find profile-summary-card-output/radical \
            -type f \
            -name "*.svg" \
            -print0 |
          xargs -0 sed -i \
            -e 's/#fe428e/#ff1744/g' \
            -e 's/#a9fef7/#f5f5f5/g' \
            -e 's/#141321/#050505/g' \
            -e 's/#f8d847/#ff003c/g' \
            -e 's/#ae81ff/#b3002d/g' \
            -e 's/#178600/#ff1744/g' \
            -e 's/#663399/#d5003d/g' \
            -e 's/#e34c26/#b3002d/g' \
            -e 's/#3178c6/#85001f/g' \
            -e 's/#b07219/#5a0014/g'

      - name: Configurar Python para exportar imagens compatíveis com celular
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar rasterizador de SVG
        run: python -m pip install --disable-pip-version-check --no-input "CairoSVG==2.7.1" "reportlab==4.2.5"

      - name: Exportar PNGs e prévia ilustrativa do Adrenalina
        run: python3 .github/scripts/render_profile_images.py

      - name: Gerar calendário real de contribuições
        run: python3 .github/scripts/generate_contributions_calendar.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Gerar currículo profissional em PDF
        run: python3 .github/scripts/generate_cv.py

      - name: Atualizar métricas acessíveis no README
        shell: bash
        run: python3 .github/scripts/update_readme_stats.py

      - name: Salvar cartões personalizados
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md profile-summary-card-output assets

          if git diff --cached --quiet; then
            echo "Nenhuma alteração encontrada."
          else
            git commit -m "Atualiza estatísticas do perfil"
            git push
          fi
